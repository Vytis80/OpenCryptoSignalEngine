name: Publish development release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag matching the root package version
        required: true
        default: v0.1.0.dev0
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Validate and publish prerelease
    runs-on: ubuntu-latest
    steps:
      - name: Require main branch
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Release workflow must be run from main; got $GITHUB_REF" >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install release tooling
        run: |
          python -m pip install --upgrade pip
          pip install "build>=1.2,<2"

      - name: Validate requested tag and release notes
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"].strip()
          with Path("pyproject.toml").open("rb") as handle:
              version = str(tomllib.load(handle)["project"]["version"])

          expected = f"v{version}"
          if tag != expected:
              raise SystemExit(f"release tag mismatch: requested={tag!r} expected={expected!r}")

          notes = Path("docs/releases") / f"{tag}.md"
          if not notes.is_file():
              raise SystemExit(f"release notes missing: {notes}")
          print(f"Validated release tag {tag} and notes {notes}")
          PY

      - name: Run release-readiness gate
        run: python tools/check_release_readiness.py

      - name: Build wheel and source distribution
        run: python -m build

      - name: Smoke-install built wheel
        run: |
          python -m venv .release-publish-venv
          .release-publish-venv/bin/python -m pip install --upgrade pip
          .release-publish-venv/bin/pip install --no-deps dist/*.whl
          cd /tmp
          "$GITHUB_WORKSPACE/.release-publish-venv/bin/python" - <<'PY'
          import open_crypto_signal_engine
          import open_crypto_signal_engine.backtesting
          import open_crypto_signal_engine.protocol
          import open_crypto_signal_engine.risk

          print("release wheel smoke import passed", open_crypto_signal_engine.__version__)
          PY

      - name: Refuse an existing tag or release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "GitHub release $RELEASE_TAG already exists" >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Git tag $RELEASE_TAG already exists without a release" >&2
            exit 1
          fi

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" \
            dist/*.whl \
            dist/*.tar.gz \
            --target "$GITHUB_SHA" \
            --title "OpenCryptoSignalEngine $RELEASE_TAG" \
            --notes-file "docs/releases/$RELEASE_TAG.md" \
            --prerelease
