name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  repository:
    name: Repository / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint shared package
        run: ruff check src tests

      - name: Format check shared package
        run: ruff format --check src tests

      - name: Test shared package
        run: pytest -q tests --cov=open_crypto_signal_engine --cov-report=term-missing

      - name: Enforce Bybit-only public scope
        run: |
          needle='o''kx'
          if git grep -n -i -I -e "$needle" -- .; then
            echo "Public repository scope is Bybit-only; remove the references above."
            exit 1
          fi

  release-readiness:
    name: Release readiness / package build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install release tooling
        run: |
          python -m pip install --upgrade pip
          pip install "build>=1.2,<2"

      - name: Validate release metadata and tracked artifacts
        run: python tools/check_release_readiness.py

      - name: Build wheel and source distribution
        run: python -m build

      - name: Smoke-install built wheel in a clean virtual environment
        run: |
          python -m venv .release-smoke-venv
          .release-smoke-venv/bin/python -m pip install --upgrade pip
          .release-smoke-venv/bin/pip install --no-deps dist/*.whl
          cd /tmp
          "$GITHUB_WORKSPACE/.release-smoke-venv/bin/python" - <<'PY'
          import open_crypto_signal_engine
          import open_crypto_signal_engine.backtesting
          import open_crypto_signal_engine.protocol
          import open_crypto_signal_engine.risk

          print("wheel smoke import passed", open_crypto_signal_engine.__version__)
          PY

      - name: Show release artifact contents
        run: |
          ls -lh dist
          python - <<'PY'
          import tarfile
          import zipfile
          from pathlib import Path

          for artifact in sorted(Path("dist").iterdir()):
              print(f"\n{artifact.name}")
              if artifact.suffix == ".whl":
                  with zipfile.ZipFile(artifact) as archive:
                      for name in archive.namelist():
                          print(name)
              elif artifact.name.endswith(".tar.gz"):
                  with tarfile.open(artifact, "r:gz") as archive:
                      for name in archive.getnames():
                          print(name)
          PY

  scanner-v26:
    name: Bybit Scanner V2.6 offline gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/scanner_v2_6/requirements.txt

      - name: Install scanner dependencies and shared protocol package
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r apps/scanner_v2_6/requirements.txt

      - name: Run network-free release gate
        working-directory: apps/scanner_v2_6
        run: python tools/run_offline_tests.py

  autotrader:
    name: Bybit Demo AutoTrader tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/autotrader/requirements.txt

      - name: Install AutoTrader dependencies and shared risk package
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r apps/autotrader/requirements.txt pytest pytest-asyncio

      - name: Run AutoTrader tests
        working-directory: apps/autotrader
        env:
          PYTHONPATH: .
        run: pytest -q tests

  legacy-v25:
    name: Frozen Bybit Scanner V2.5 regression tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: legacy/scanner_v2_5/requirements.txt

      - name: Install frozen baseline dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r legacy/scanner_v2_5/requirements.txt pytest pytest-asyncio

      - name: Run frozen baseline self-test
        working-directory: legacy/scanner_v2_5
        run: python self_test.py

      - name: Run frozen baseline regression tests
        working-directory: legacy/scanner_v2_5
        run: pytest -q -o asyncio_mode=auto
