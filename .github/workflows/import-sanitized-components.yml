name: Import sanitized components

on:
  push:
    branches: [feat/import-bybit-components]
    paths:
      - .github/import_payload.ready

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout import branch
        uses: actions/checkout@v7
        with:
          ref: feat/import-bybit-components
          fetch-depth: 0

      - name: Reassemble and verify sanitized payload
        run: |
          set -euo pipefail
          cat .github/import_payload.part-* > /tmp/oss-import.b64
          base64 -d /tmp/oss-import.b64 > /tmp/oss-import.tar.xz
          echo "56b8a5a79cc99f1c33fd2bd3f35fc76510952cb0fb6f7ea0cf2303e892665ec3  /tmp/oss-import.tar.xz" | sha256sum -c -

      - name: Validate archive paths and extract
        shell: python
        run: |
          from pathlib import Path, PurePosixPath
          import lzma
          import tarfile

          archive = Path('/tmp/oss-import.tar.xz')
          with lzma.open(archive, 'rb') as compressed:
              with tarfile.open(fileobj=compressed, mode='r:') as tf:
                  members = tf.getmembers()
                  if not members:
                      raise SystemExit('Refusing empty import archive')
                  for member in members:
                      path = PurePosixPath(member.name)
                      if path.is_absolute() or '..' in path.parts:
                          raise SystemExit(f'Unsafe archive path: {member.name}')
                      if member.issym() or member.islnk():
                          raise SystemExit(f'Links are not allowed in import archive: {member.name}')
                  tf.extractall('.')
          print(f'Validated and extracted {len(members)} archive entries')

      - name: Fail closed on secret-bearing artifacts
        shell: python
        run: |
          from pathlib import Path
          import re
          import sys

          root = Path('.')
          findings = []
          webhook = re.compile(r'https?://(?:canary\.|ptb\.)?discord(?:app)?\.com/api/webhooks/\d+/[A-Za-z0-9._-]+', re.I)
          discord_token = re.compile(r'(?<![A-Za-z0-9_-])[A-Za-z0-9_-]{20,30}\.[A-Za-z0-9_-]{6}\.[A-Za-z0-9_-]{25,45}(?![A-Za-z0-9_-])')
          private_key = re.compile(r'-----BEGIN (?:RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----')
          home_path = re.compile(r'/home/[A-Za-z0-9._-]+/')
          long_id = re.compile(r'(?<!\d)1\d{17,19}(?!\d)')
          env_secret = re.compile(r'^[ \t]*([A-Z0-9_]*(?:TOKEN|SECRET|API_KEY|API_SECRET|WEBHOOK(?:_URL)?)[A-Z0-9_]*)[ \t]*=[ \t]*(.*?)[ \t]*$', re.M)

          def is_safe_example_value(raw: str) -> bool:
              value = raw.strip().strip('"\'')
              low = value.lower()
              if not value or low in {'0', '1', 'true', 'false', 'none', 'null', 'changeme', 'replace_me', 'placeholder'}:
                  return True
              if low.startswith(('your_', 'replace_', 'example_', 'dummy_', 'test_')):
                  return True
              if value.startswith('${') and value.endswith('}'):
                  return True
              if value.startswith('<') and value.endswith('>'):
                  return True
              return False

          for p in root.rglob('*'):
              if not p.is_file() or '.git' in p.parts:
                  continue
              rel = str(p)
              n = p.name.lower()
              if rel.startswith('.github/import_payload.'):
                  continue
              if n == '.env' or (n.startswith('.env.') and n != '.env.example'):
                  findings.append((rel, 'runtime env / env backup'))
              if n == '.bridge_secret' or '.bak' in n or 'backup' in n:
                  findings.append((rel, 'secret/backup artifact'))
              if n.endswith(('.db', '.sqlite', '.sqlite3', '.log')) or '.db.' in n:
                  findings.append((rel, 'runtime database/log artifact'))
              try:
                  text = p.read_text(encoding='utf-8')
              except Exception:
                  continue
              for label, rx in [
                  ('Discord webhook', webhook),
                  ('Discord token', discord_token),
                  ('private key', private_key),
                  ('private home path', home_path),
                  ('account-specific long ID', long_id),
              ]:
                  if rx.search(text):
                      findings.append((rel, label))
              if p.name == '.env.example':
                  for key, value in env_secret.findall(text):
                      if not is_safe_example_value(value) and not key.startswith(('REQUIRE_', 'ENABLE_', 'DISABLE_')):
                          findings.append((rel, f'real-looking secret value in .env.example: {key}'))

          if findings:
              for item in findings:
                  print(item)
              sys.exit('Refusing to commit sanitized import: safety scan failed')
          print('Import safety scan passed')

      - name: Validate Python syntax
        run: |
          python -m compileall -q apps legacy

      - name: Commit imported source and remove transport files
        run: |
          set -euo pipefail
          rm -f .github/import_payload.part-* .github/import_payload.ready
          rm -f .github/workflows/import-sanitized-components.yml
          find apps legacy -type d -name __pycache__ -prune -exec rm -rf {} +
          find apps legacy -type f -name '*.pyc' -delete
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: import sanitized Bybit scanner and demo trader sources"
          git push origin HEAD:feat/import-bybit-components
