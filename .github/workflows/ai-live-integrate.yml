name: Integrate AI Judge sidecar

on:
  push:
    branches: [feat/import-ai-judge-shadow]

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/import-ai-judge-shadow
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply fail-closed AI sidecar patch
        run: python .github/ai_live_patch_fix.py

      - name: Compile changed Python
        run: python -m compileall -q apps/scanner_v2_6 legacy/scanner_v2_5

      - name: Install scanner test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/scanner_v2_6/requirements.txt pytest

      - name: Run credential-free AI checks
        run: |
          (cd apps/scanner_v2_6 && python test_ai_judge_contract.py && python test_ai_storage.py && python test_ai_nonblocking.py)
          (cd legacy/scanner_v2_5 && python test_ai_judge_contract.py && python test_ai_storage_usage.py && python test_ai_db_migration.py && python test_ai_nonblocking.py)

      - name: Guard against obvious secrets and runtime files
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          roots=[Path('apps/scanner_v2_6'),Path('legacy/scanner_v2_5')]
          forbidden_names={'.env','.bridge_secret'}
          bad=[]
          token_patterns=[
              re.compile(r'(?i)(?:groq|discord|bybit)[_-]?(?:api[_-]?)?(?:key|secret|token)\s*[=:]\s*["\']?[A-Za-z0-9_\-]{20,}'),
              re.compile(r'https://discord(?:app)?\.com/api/webhooks/\d+/[A-Za-z0-9._-]+'),
              re.compile(r'gsk_[A-Za-z0-9]{20,}'),
          ]
          for root in roots:
              for p in root.rglob('*'):
                  if not p.is_file(): continue
                  low=p.name.lower()
                  if p.name in forbidden_names or low.endswith(('.db','.sqlite','.sqlite3','.log')) or '.bak' in low or 'backup' in low:
                      bad.append(f'forbidden file: {p}')
                      continue
                  if p.suffix.lower() not in {'.py','.md','.txt','.example','.sh','.toml','.yml','.yaml'} and p.name != '.env.example':
                      continue
                  try: text=p.read_text(errors='ignore')
                  except Exception: continue
                  for pat in token_patterns:
                      if pat.search(text): bad.append(f'possible secret: {p}')
          if bad:
              print('\n'.join(bad))
              raise SystemExit(1)
          print('secret/runtime guard: OK')
          PY

      - name: Remove one-shot patchers before commit
        run: rm -f .github/ai_live_patch.py .github/ai_live_patch_fix.py

      - name: Commit integrated code
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A ':!.github/workflows/ai-live-integrate.yml'
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No integration changes to commit.'
            exit 0
          fi
          git commit -m 'feat: integrate shadow-only GPT-OSS AI Judge'
          git push origin HEAD:feat/import-ai-judge-shadow
