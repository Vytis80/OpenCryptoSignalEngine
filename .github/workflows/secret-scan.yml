name: Secret scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Scan tracked files for credentials and private runtime artifacts
        shell: python
        run: |
          from pathlib import Path
          import re
          import subprocess
          import sys

          files = [
              Path(p)
              for p in subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0")
              if p
          ]

          findings = []
          webhook = re.compile(
              r"https?://(?:canary\.|ptb\.)?discord(?:app)?\.com/api/webhooks/\d+/[A-Za-z0-9._-]+",
              re.I,
          )
          discord_token = re.compile(
              r"(?<![A-Za-z0-9_-])[A-Za-z0-9_-]{20,30}\.[A-Za-z0-9_-]{6}\.[A-Za-z0-9_-]{25,45}(?![A-Za-z0-9_-])"
          )
          private_key = re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----")
          private_home = re.compile(r"/home/[A-Za-z0-9._-]+/")
          secret_assignment = re.compile(
              r"^[ \t]*([A-Z0-9_]*(?:TOKEN|SECRET|API_KEY|API_SECRET|WEBHOOK(?:_URL)?)[A-Z0-9_]*)"
              r"[ \t]*=[ \t]*(.*?)[ \t]*$",
              re.M,
          )

          def safe_example_value(raw: str) -> bool:
              value = raw.strip().strip("\"'")
              low = value.lower()
              if not value or low in {
                  "0", "1", "true", "false", "none", "null",
                  "changeme", "replace_me", "placeholder",
              }:
                  return True
              if low.startswith(("your_", "replace_", "example_", "dummy_", "test_")):
                  return True
              if value.startswith("${") and value.endswith("}"):
                  return True
              if value.startswith("<") and value.endswith(">"):
                  return True
              return False

          for path in files:
              name = path.name.lower()
              rel = path.as_posix()

              if name == ".env" or (name.startswith(".env.") and name != ".env.example"):
                  findings.append((rel, "runtime environment file"))
              if name == ".bridge_secret" or ".bak" in name or "backup" in name:
                  findings.append((rel, "secret/backup artifact"))
              if name.endswith((".db", ".sqlite", ".sqlite3", ".log")) or ".db." in name:
                  findings.append((rel, "runtime database/log artifact"))

              try:
                  text = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue

              for label, pattern in (
                  ("Discord webhook", webhook),
                  ("Discord token", discord_token),
                  ("private key", private_key),
                  ("private home path", private_home),
              ):
                  if pattern.search(text):
                      findings.append((rel, label))

              if path.name == ".env.example":
                  for key, value in secret_assignment.findall(text):
                      if not safe_example_value(value):
                          findings.append((rel, f"real-looking secret value: {key}"))

          if findings:
              print("Secret scan failed:")
              for rel, reason in findings:
                  print(f"  {rel}: {reason}")
              sys.exit(1)

          print(f"Secret scan passed for {len(files)} tracked files")
